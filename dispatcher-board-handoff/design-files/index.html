<!DOCTYPE html>
<html lang="sr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Valé — Dispečerska tabla</title>
<!-- Self-contained: design tokens extracted from the Auto Concierge DS.
     No dependency on the design-system bundle (BrandMark/vehicle icons fall
     back to local SVGs). -->
<link rel="stylesheet" href="tokens.css">
<style>
  :root {
    --rd-bg: #0a110d;
    --role-accent: #6fd3a3; /* dispatcher = mint */
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--rd-bg); color: var(--text); font-family: var(--font-body); overflow-x: hidden; }

  /* ── Ambient drifting glows ───────────────────────────── */
  .rd-ambient { position: fixed; inset: 0; pointer-events: none; z-index: 0; overflow: hidden; }
  .rd-ambient span { position: absolute; border-radius: 50%; filter: blur(90px); opacity: 0.30; }
  .rd-ambient .g1 { width: 600px; height: 600px; top: -360px; right: -220px; background: radial-gradient(circle, rgba(111,211,163,0.18), transparent 66%); animation: rd-drift1 22s ease-in-out infinite; }
  .rd-ambient .g2 { width: 560px; height: 560px; bottom: -300px; left: -180px; background: radial-gradient(circle, rgba(201,168,106,0.16), transparent 64%); animation: rd-drift2 28s ease-in-out infinite; }
  .rd-ambient .g3 { width: 420px; height: 420px; top: 52%; left: 58%; background: radial-gradient(circle, rgba(167,139,250,0.08), transparent 70%); animation: rd-drift1 26s ease-in-out infinite reverse; }
  @keyframes rd-drift1 { 0%,100% { transform: translate(0,0) scale(1); } 50% { transform: translate(-50px,40px) scale(1.12); } }
  @keyframes rd-drift2 { 0%,100% { transform: translate(0,0) scale(1); } 50% { transform: translate(60px,-40px) scale(1.1); } }

  /* ── Glass surfaces ───────────────────────────────────── */
  .glass {
    background: var(--glass);
    backdrop-filter: blur(22px) saturate(125%);
    -webkit-backdrop-filter: blur(22px) saturate(125%);
    border: 1px solid var(--glass-border);
    border-radius: 24px;
    box-shadow: 0 24px 60px -28px rgba(0,0,0,0.75), inset 0 1px 0 rgba(255,255,255,0.05);
  }
  .glass-soft {
    background: var(--glass-soft);
    backdrop-filter: blur(16px) saturate(115%);
    -webkit-backdrop-filter: blur(16px) saturate(115%);
    border: 1px solid var(--glass-line);
    border-radius: 18px;
  }

  /* ── Entrance / motion ────────────────────────────────── */
  .rd-rise { animation: rd-rise .55s cubic-bezier(.22,.9,.3,1) both; }
  @keyframes rd-rise { from { transform: translateY(12px); } to { transform: none; } }
  .rd-fade { animation: rd-fade .4s ease both; }
  @keyframes rd-fade { from { transform: translateY(6px); } to { transform: none; } }
  .rd-pop { animation: rd-pop-in .15s ease both; }
  @keyframes rd-pop-in { from { opacity: 0; } to { opacity: 1; } }
  .rd-scrim { animation: rd-scrim-in .25s ease both; }
  @keyframes rd-scrim-in { from { opacity: 0; } to { opacity: 1; } }
  .rd-pulse { position: relative; }
  .rd-pulse::after { content: ""; position: absolute; inset: 0; border-radius: 50%; background: var(--mint); animation: rd-pulse 1.9s ease-out infinite; }
  @keyframes rd-pulse { 0% { transform: scale(1); opacity: .55; } 70%,100% { transform: scale(2.6); opacity: 0; } }
  .rd-flash { animation: rd-flash 1.1s ease-out; }
  @keyframes rd-flash { 0% { background: color-mix(in srgb, var(--mint) 22%, transparent); } 100% { background: rgba(255,255,255,0.04); } }

  .rd-card-hover { transition: transform .18s cubic-bezier(.2,1,.3,1), border-color .18s, box-shadow .18s; }
  .rd-card-hover:hover { transform: translateY(-2px); border-color: var(--glass-border); box-shadow: 0 22px 48px -26px rgba(0,0,0,0.8); }

  ::-webkit-scrollbar { height: 9px; width: 9px; }
  ::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.10); border-radius: 8px; }
  ::-webkit-scrollbar-track { background: transparent; }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation: none !important; transition: none !important; }
    .rd-rise, .rd-fade { opacity: 1 !important; transform: none !important; }
  }
</style>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
</head>
<body>
<div class="rd-ambient"><span class="g1"></span><span class="g2"></span><span class="g3"></span></div>
<div id="root" style="position:relative;z-index:1;"></div>
<script type="text/babel" src="DispatcherBoardApp.jsx.txt"></script>
<script type="text/babel">
  const App = window.DispatcherBoardApp;
  ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>
