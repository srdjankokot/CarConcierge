<!-- @dsCard group="Concierge App" viewport="1024x760" name="Concierge App" subtitle="Glass + bento redesign — animated live-tracking, stepper, staggered entrance" -->
<!DOCTYPE html>
<html lang="sr">
<head>
<meta charset="UTF-8">
<title>Valé — Redesign</title>
<link rel="stylesheet" href="../../styles.css">
<style>
  :root {
    /* Deepened, higher-contrast base for the bold direction */
    --rd-bg: #0a110d;
    --glass: linear-gradient(155deg, rgba(28,46,36,0.62), rgba(15,24,19,0.52));
    --glass-soft: linear-gradient(155deg, rgba(24,38,30,0.50), rgba(13,21,16,0.42));
    --glass-border: rgba(216,189,138,0.14);
    --glass-line: rgba(255,255,255,0.06);
    --brass-grad: linear-gradient(135deg, #e0c184, #c9a86a 55%, #a67f3d);
    --mint-grad: linear-gradient(135deg, #8fe7c0, #6fd3a3);
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--rd-bg); color: var(--text); font-family: var(--font-body); overflow-x: hidden; }

  /* ── Ambient drifting glows ───────────────────────────── */
  .rd-ambient { position: fixed; inset: 0; pointer-events: none; z-index: 0; overflow: hidden; }
  .rd-ambient span { position: absolute; border-radius: 50%; filter: blur(90px); opacity: 0.32; }
  .rd-ambient .g1 { width: 600px; height: 600px; top: -360px; right: -220px; background: radial-gradient(circle, rgba(201,168,106,0.24), transparent 66%); animation: rd-drift1 22s ease-in-out infinite; }
  .rd-ambient .g2 { width: 560px; height: 560px; bottom: -280px; left: -180px; background: radial-gradient(circle, rgba(111,211,163,0.16), transparent 64%); animation: rd-drift2 28s ease-in-out infinite; }
  .rd-ambient .g3 { width: 420px; height: 420px; top: 55%; left: 60%; background: radial-gradient(circle, rgba(167,139,250,0.10), transparent 70%); animation: rd-drift1 26s ease-in-out infinite reverse; }
  @keyframes rd-drift1 { 0%,100% { transform: translate(0,0) scale(1); } 50% { transform: translate(-50px,40px) scale(1.12); } }
  @keyframes rd-drift2 { 0%,100% { transform: translate(0,0) scale(1); } 50% { transform: translate(60px,-40px) scale(1.1); } }

  /* ── Glass surfaces ───────────────────────────────────── */
  .glass {
    background: var(--glass);
    backdrop-filter: blur(22px) saturate(125%);
    -webkit-backdrop-filter: blur(22px) saturate(125%);
    border: 1px solid var(--glass-border);
    border-radius: 24px;
    box-shadow: 0 24px 60px -28px rgba(0,0,0,0.75), inset 0 1px 0 rgba(255,255,255,0.05);
  }
  .glass-soft {
    background: var(--glass-soft);
    backdrop-filter: blur(16px) saturate(115%);
    -webkit-backdrop-filter: blur(16px) saturate(115%);
    border: 1px solid var(--glass-line);
    border-radius: 20px;
  }

  /* ── Entrance / motion ────────────────────────────────── */
  .rd-rise { opacity: 0; transform: translateY(16px); animation: rd-rise .6s cubic-bezier(.22,.9,.3,1) forwards; }
  @keyframes rd-rise { to { opacity: 1; transform: none; } }
  .rd-fade { opacity: 0; animation: rd-fade .5s ease forwards; }
  @keyframes rd-fade { to { opacity: 1; } }
  .rd-pop { animation: rd-pop .45s cubic-bezier(.2,1.3,.4,1) forwards; }
  @keyframes rd-pop { from { transform: scale(0); } to { transform: scale(1); } }

  .rd-pulse { position: relative; }
  .rd-pulse::after { content: ""; position: absolute; inset: 0; border-radius: 50%; background: var(--mint); animation: rd-pulse 1.9s ease-out infinite; }
  @keyframes rd-pulse { 0% { transform: scale(1); opacity: .55; } 70%,100% { transform: scale(2.6); opacity: 0; } }

  .rd-shimmer { position: relative; overflow: hidden; }
  .rd-shimmer::before { content: ""; position: absolute; top: 0; left: -60%; width: 50%; height: 100%; background: linear-gradient(100deg, transparent, rgba(255,255,255,0.25), transparent); transform: skewX(-18deg); animation: rd-shimmer 3.6s ease-in-out infinite; }
  @keyframes rd-shimmer { 0%,18% { left: -60%; } 38%,100% { left: 130%; } }

  /* primary glass-brass button */
  .rd-btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; font-family: var(--font-body); font-weight: 600; font-size: 15px; padding: 13px 24px; border-radius: 14px; border: none; cursor: pointer; background: var(--brass-grad); color: #1a130a; box-shadow: 0 8px 24px -6px rgba(201,168,106,0.5); transition: transform .18s cubic-bezier(.2,1,.3,1), box-shadow .18s, filter .18s; }
  .rd-btn:hover { transform: translateY(-2px); box-shadow: 0 14px 34px -8px rgba(201,168,106,0.62); filter: brightness(1.04); }
  .rd-btn:active { transform: translateY(0) scale(.98); }
  .rd-btn-ghost { display: inline-flex; align-items: center; justify-content: center; gap: 8px; font-weight: 500; font-size: 15px; padding: 13px 22px; border-radius: 14px; cursor: pointer; color: var(--text); background: rgba(255,255,255,0.04); border: 1px solid var(--glass-border); transition: border-color .18s, background .18s, transform .18s; }
  .rd-btn-ghost:hover { border-color: var(--brass); background: rgba(255,255,255,0.07); transform: translateY(-1px); }

  .rd-tab { position: relative; background: none; border: none; cursor: pointer; padding: 12px 4px; font-size: 14.5px; color: var(--text-dim); transition: color .2s; }
  .rd-tab.on { color: var(--text); }
  .rd-tab .ink { position: absolute; left: 0; right: 0; bottom: -1px; height: 2px; border-radius: 2px; background: var(--role-accent); box-shadow: 0 0 10px var(--role-accent); }

  .rd-card-hover { transition: transform .2s cubic-bezier(.2,1,.3,1), border-color .2s, box-shadow .2s; }
  .rd-card-hover:hover { transform: translateY(-4px); border-color: var(--glass-border); box-shadow: 0 28px 60px -28px rgba(0,0,0,0.8); }

  input.rd-in, select.rd-in { width: 100%; background: rgba(8,14,11,0.6); border: 1px solid var(--glass-line); border-radius: 13px; padding: 13px 15px; color: var(--text); font-family: var(--font-body); font-size: 14.5px; transition: border-color .18s, box-shadow .18s, background .18s; outline: none; }
  input.rd-in::placeholder { color: var(--text-faint); }
  input.rd-in:focus, select.rd-in:focus { border-color: var(--brass); box-shadow: 0 0 0 3px rgba(201,168,106,0.14); background: rgba(8,14,11,0.8); }
  .rd-label { display: block; font-size: 12px; font-weight: 500; color: var(--text-dim); margin-bottom: 7px; letter-spacing: .2px; }

  ::-webkit-scrollbar { height: 8px; width: 8px; }
  ::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.08); border-radius: 8px; }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation: none !important; transition: none !important; }
    .rd-rise, .rd-fade { opacity: 1 !important; transform: none !important; }
  }
</style>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="../../_ds_bundle.js"></script>
</head>
<body>
<div class="rd-ambient"><span class="g1"></span><span class="g2"></span><span class="g3"></span></div>
<div id="root" style="position:relative;z-index:1;"></div>
<script type="text/babel" src="RedesignApp.jsx"></script>
<script type="text/babel">
  const App = window.AutoConciergeAppRedesign;
  ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>
